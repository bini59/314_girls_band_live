name: Deploy

on:
  workflow_dispatch:

# Legacy rollback reference: manual only. Run from the pre-D1 commit, never this migration code.
concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # 1) 이미지 빌드/푸시는 GitHub-hosted (격리 VM, 무료, 빠른 캐시).
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build & Push image to GHCR
    # 네이티브 ARM 러너 (public 저장소 무료) — QEMU 에뮬레이션 회피로 빌드 ~3배 단축.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: stamp
        run: echo "ts=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=long
            type=sha,prefix=sha-
            # sha-<commit>-<unix time>: Flux (bini59/homelab apps/gbl) rolls out the newest one
            type=raw,value=sha-${{ github.sha }}-${{ steps.stamp.outputs.ts }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 배포 서버 ARM64 단일 아키텍처 — 빌드 시간 최소화.
          # 다른 아키텍처 서버 추가 시 platforms 에 추가.
          platforms: linux/arm64

# Production (band-live.bini59.dev) is the gbl Deployment on the Oracle k3s, managed by Flux from bini59/homelab
# (apps/gbl): it rolls out the newest sha-<commit>-<unix time> tag and runs prisma migrate deploy in an init container.
