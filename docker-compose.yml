services:
  postgres:
    image: postgres:16-alpine
    container_name: gbl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gbl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gbl_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-girls_band_live}
      TZ: Asia/Tokyo
      PGTZ: Asia/Tokyo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gbl} -d ${POSTGRES_DB:-girls_band_live}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4-standalone
    container_name: gbl-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: dracula
    depends_on:
      postgres:
        condition: service_healthy

  # ============================================================================
  # Next.js 앱 (production 빌드). 단일 컨테이너.
  #
  # 라우팅: CF 터널이 도커 네트워크에서 `gbl:3000` 으로 직접 붙는다 (nginx 게이트웨이 없음).
  # 호스트 노출 `${APP_PORT:-31401}:3000` 은 직접 접근/디버그용.
  #
  # 배포: 이미지 교체 후 재기동 (~1-3초 blip). 무중단 불필요 판단 —
  # 저트래픽 아카이브 + 월 단위 배포 + 앱 부팅 ~0.2s 라 blue/green 비용이 이득을 상회.
  # HEALTHCHECK 는 Dockerfile 에 정의됨.
  # ============================================================================
  gbl:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    image: ${APP_IMAGE:-girls-band-live:local}
    container_name: gbl
    restart: unless-stopped
    ports:
      - "${APP_PORT:-31401}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gbl}:${POSTGRES_PASSWORD:-gbl_dev_password}@postgres:5432/${POSTGRES_DB:-girls_band_live}?schema=public
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?must set ADMIN_PASSWORD_HASH (see README)}
      JWT_SECRET: ${JWT_SECRET:?must set JWT_SECRET (>=32 bytes hex)}
      NODE_ENV: production
      TZ: Asia/Tokyo
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    name: gbl_postgres_data
